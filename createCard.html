<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    html,
    body {
        height: 100%;
    }


    .container {
        width: 100%;
        height: 100%;
        padding: 20px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
    }

    .cardList {
        list-style: none;
        padding: 20px;
        border: 1px solid #ccc;
        width: 100%;
        height: 800px;
        border-radius: 10px;
        overflow-y: auto;
        box-sizing: border-box;
        margin-top: 10px;
        flex: 1;
    }

    .cardList li {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background: url('https://img1.baidu.com/it/u=1926197466,3014653606&fm=253&fmt=auto&app=138&f=JPEG?w=800&h=500') no-repeat center center;
        background-size: cover;

    }

    .cardList li.moving {
        background: rgba(0, 0, 0, 0.1);
    }

    .cardList li+li {
        margin-top: 10px;
    }

    .cardList li .name {
        font-weight: bold;
        font-size: 18px;
    }

    .cardList li .profession {
        font-size: 16px;
        color: #666;
    }

    .cardList li .description {
        font-size: 14px;
        color: #999;
    }
</style>

<body>
    <div class="container">
        <div class="inpBox">
            <label for="name">姓名：</label>
            <input type="text" id="name" name="name">
            <br />
            <label for="profession">职业：</label>
            <input type="text" id="profession" name="profession">
            <button onclick="createCard()">创建卡片</button>
        </div>
        <ul class="cardList">

        </ul>
    </div>
</body>

<script>
    const createCard = () => {
        const name = document.getElementById('name').value;
        const profession = document.getElementById('profession').value;
        if (name.trim() === '' || profession.trim() === '') {
            alert('姓名和职业不能为空！');
            return;
        }
        const cardList = document.querySelector('.cardList');
        const cardItem = document.createElement('li');
        const oName = document.createElement('div');
        oName.className = 'name';
        oName.textContent = name;
        const oProfession = document.createElement('div');
        oProfession.className = 'profession';
        oProfession.textContent = profession;
        const oDescription = document.createElement('div');
        oDescription.className = 'description';
        oDescription.textContent = '这是卡片的描述内容。';
        setDrag(cardItem);

        cardItem.appendChild(oName);
        cardItem.appendChild(oProfession);
        cardItem.appendChild(oDescription);
        cardList.appendChild(cardItem);
    };

    // 为元素添加拖拽事件
    const setDrag = (element) => {


        element.onclick = async (e) => {
            const name = element.querySelector('.name').textContent
            const profession = element.querySelector('.profession').textContent
            try {
                await navigator.share({
                    title: `${name}(${profession}`,   // 分享卡片的标题
                    text: '这篇文章真的很有启发，值得一看！', // 分享的文本描述
                    url: `https://1109335032.github.io/cyj?title=${name}(${profession})` // 当前页面的链接
                });
                console.log('分享成功！');
            } catch (error) {
                // 如果用户取消分享，或者发生其他错误，会在这里捕获
                if (error.name !== 'AbortError') {
                    console.error('分享失败了:', error);
                }
            }
        }

        // element.addEventListener('touchstart', (e) => {
        //     console.log(e)
        // });


        // element.addEventListener('touchmove', (e) => {
        //     console.log(e)
        // });
    }
</script>

</html>
